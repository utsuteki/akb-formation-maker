<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKB48 Senbatsu Formation Maker</title>
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch-polyfill@1.4.1/dragdroptouch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* --- General Page Styles --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overscroll-behavior-y: contain;
        }

        h1, h2 { color: #333; margin-bottom: 10px; }

        /* --- Formation Area --- */
        #formation-canvas {
            width: 95%;
            max-width: 1200px;
            min-height: 300px;
            background-color: white;
            border: 2px solid #b0bec5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: grid;
            grid-template-rows: repeat(3, min-content);
            gap: 5px; 
        }

        .row-wrapper {
            display: flex;
            align-items: center;
            min-height: 125px;
            border-bottom: 1px dashed #eceff1;
        }

        .row-wrapper:last-child { border-bottom: none; }

        .row-label {
            font-size: 10px;
            font-weight: bold;
            color: #90a4ae;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 60px;
            text-align: center;
            user-select: none;
            pointer-events: none;
            line-height: 1.2;
        }

        .formation-row {
            flex-grow: 1;
            min-height: 125px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .formation-row .member-slot { cursor: pointer; }

        .formation-row.drag-over {
            background-color: rgba(33, 150, 243, 0.05);
            outline: 2px dashed #2196F3;
            border-radius: 8px;
        }

        /* --- Member Slot --- */
        .member-slot {
            width: 120px;
            height: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .member-slot img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .member-slot.is-selected {
            opacity: 0.2 !important;
            filter: grayscale(100%);
            pointer-events: none;
        }

        /* --- Roster --- */
        #member-roster {
            width: 95%;
            max-width: 1200px;
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #roster-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .roster-member { cursor: grab; }

        /* --- Badges --- */
        .member-slot.is-center::after {
            content: 'センター';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            z-index: 10;
        }

        .member-slot.is-newcomer::before {
            content: '初';
            position: absolute;
            top: 2px;
            left: 2px;
            background: #f44336;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 3px;
            z-index: 10;
        }

        /* --- UI Controls --- */
        #controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .title-input-group { display: flex; align-items: center; gap: 10px; font-weight: bold; margin-bottom: 10px; }
        #canvas-title-display { text-align: center; font-size: 36px; font-weight: 800; margin-bottom: 20px; min-height: 45px; width: 100%; }
        button { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-download { background-color: #ffb7c5; color: white; }
        .btn-reset { background-color: #b0bec5; color: white; }
    </style>
</head>
<body>

    <h1>AKB48 Senbatsu Formation Maker</h1>
    
    <div id="controls">
        <button class="btn-reset" onclick="resetFormation()">Reset Formation</button>
        <button class="btn-download" onclick="downloadFormation()">Download PNG</button>
    </div>

    <div class="title-input-group">
        <label for="formation-title-input">Type the title:</label>
        <input type="text" id="formation-title-input" placeholder="e.g., AKB48 68th Single" oninput="updateTitle(this.value)">
    </div>

    <div id="formation-canvas">
        <div id="canvas-title-display"></div>
        <div class="row-wrapper">
            <div class="row-label">3rd<br>Row</div>
            <div class="formation-row" data-row-id="3"></div>
        </div>
        <div class="row-wrapper">
            <div class="row-label">2nd<br>Row</div>
            <div class="formation-row" data-row-id="2"></div>
        </div>
        <div class="row-wrapper">
            <div class="row-label">1st<br>Row</div>
            <div class="formation-row" data-row-id="1"></div>
        </div>
    </div>

    <div id="member-roster">
        <h2>Select Members</h2>
        <div id="roster-list"></div>
    </div>

    <script>
        const allMembers = Array.from({ length: 51 }, (_, i) => ({
            id: `idol_${(i + 1).toString().padStart(2, '0')}`,
            name: `idol${(i + 1).toString().padStart(2, '0')}`,
            image: `./images/100${(1 + i).toString().padStart(2, '0')}.jpg`
        }));

        /* --- INITIALIZATION --- */
        const rosterListDiv = document.getElementById('roster-list');
        allMembers.forEach(member => {
            rosterListDiv.appendChild(createDraggableMemberElement(member));
        });

        document.querySelectorAll('.formation-row').forEach(row => {
            row.addEventListener('dragenter', handleDragEnter);
            row.addEventListener('dragover', handleDragOver);
            row.addEventListener('dragleave', handleDragLeave);
            row.addEventListener('drop', handleDrop);
        });

        /* --- LOGIC --- */
        function createDraggableMemberElement(memberData) {
            const container = document.createElement('div');
            container.classList.add('member-slot', 'roster-member');
            container.id = memberData.id;
            container.setAttribute('draggable', 'true');

            container.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', memberData.id);
                const isCanvas = container.parentElement.classList.contains('formation-row');
                e.dataTransfer.setData('source', isCanvas ? 'canvas' : 'roster');
            });

            const img = document.createElement('img');
            img.src = memberData.image;
            img.alt = memberData.name;
            container.appendChild(img);
            return container;
        }

        function handleDragEnter(e) { e.preventDefault(); this.classList.add('drag-over'); }
        function handleDragOver(e) { e.preventDefault(); }
        function handleDragLeave(e) { this.classList.remove('drag-over'); }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            const droppedId = e.dataTransfer.getData('text/plain');
            const source = e.dataTransfer.getData('source');
            const existingElement = document.getElementById(droppedId);
            if (!droppedId || !existingElement) return;

            const afterElement = getDragAfterElement(this, e.clientX);

            if (source === 'canvas') {
                if (afterElement == null) this.appendChild(existingElement);
                else this.insertBefore(existingElement, afterElement);
            } else {
                if (existingElement.classList.contains('is-selected')) return;
                
                // Max Limit Check
                if (this.querySelectorAll('.member-slot').length >= 10) {
                    alert("Row is full!");
                    return;
                }

                existingElement.classList.add('is-selected');
                const memberData = allMembers.find(m => m.id === droppedId);
                const formationMember = createDraggableMemberElement(memberData);
                
                formationMember.onclick = function() {
                    if (!this.classList.contains('is-center') && !this.classList.contains('is-newcomer')) {
                        this.classList.add('is-center');
                    } else if (this.classList.contains('is-center')) {
                        this.classList.remove('is-center');
                        this.classList.add('is-newcomer');
                    } else {
                        existingElement.classList.remove('is-selected');
                        this.remove();
                    }
                };

                if (afterElement == null) this.appendChild(formationMember);
                else this.insertBefore(formationMember, afterElement);
            }
        }

        function getDragAfterElement(container, x) {
            const draggableElements = [...container.querySelectorAll('.member-slot:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function updateTitle(val) { document.getElementById('canvas-title-display').innerText = val; }

        function resetFormation() {
            document.querySelectorAll('.formation-row').forEach(row => row.innerHTML = '');
            document.querySelectorAll('.member-slot').forEach(m => m.classList.remove('is-selected'));
            document.getElementById('formation-title-input').value = '';
            document.getElementById('canvas-title-display').innerText = '';
        }

        function downloadFormation() {
            const canvas = document.getElementById('formation-canvas');
            html2canvas(canvas, { backgroundColor: "#ffffff", scale: 3 }).then(image => {
                const link = document.createElement('a');
                link.download = 'formation.png';
                link.href = image.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
