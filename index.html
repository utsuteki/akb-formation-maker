<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKB48 Senbatsu Formation Maker</title>
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch-polyfill@1.4.1/dragdroptouch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overscroll-behavior-y: contain;
        }

        h1, h2 { color: #333; }

        #formation-canvas {
            width: 95%;
            max-width: 1200px;
            min-height: 300px;
            background-color: white;
            border: 2px solid #b0bec5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: grid;
            grid-template-rows: repeat(3, min-content);
            gap: 5px; 
        }

        .row-wrapper {
            display: flex;
            align-items: center;
            min-height: 125px;
            border-bottom: 1px dashed #eceff1;
        }

        .row-label {
            font-size: 10px;
            font-weight: bold;
            color: #90a4ae;
            width: 60px;
            text-align: center;
            user-select: none;
        }

        .formation-row {
            flex-grow: 1;
            min-height: 125px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .formation-row.drag-over {
            background-color: rgba(33, 150, 243, 0.05);
            outline: 2px dashed #2196F3;
        }

        .member-slot {
            width: 120px;
            position: relative;
            flex-shrink: 0;
            cursor: grab;
        }

        .member-slot img {
            width: 100%;
            pointer-events: none;
        }

        /* Gray out roster item when used */
        .is-selected {
            opacity: 0.2 !important;
            filter: grayscale(100%);
            pointer-events: none !important;
        }

        .member-slot.is-center::after {
            content: 'センター';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            background: #D4AF37;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        .member-slot.is-newcomer::before {
            content: '初';
            position: absolute;
            top: 2px;
            left: 2px;
            background: #f44336;
            color: white;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        #member-roster {
            width: 95%;
            max-width: 1200px;
            background-color: white;
            border-radius: 12px;
            padding: 20px;
        }

        #roster-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        #controls { margin-bottom: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
        .btn-reset { background: #b0bec5; color: white; }
        .btn-download { background: #ffb7c5; color: white; }
    </style>
</head>
<body>

    <h1>AKB48 Senbatsu Formation Maker</h1>
    
    <div id="controls">
        <button class="btn-reset" onclick="resetFormation()">Reset</button>
        <button class="btn-download" onclick="downloadFormation()">Download PNG</button>
    </div>

    <div id="formation-canvas">
        <div id="canvas-title-display" style="text-align:center; font-size: 24px; font-weight: bold;"></div>
        <div class="row-wrapper"><div class="row-label">3rd Row</div><div class="formation-row" data-row-id="3"></div></div>
        <div class="row-wrapper"><div class="row-label">2nd Row</div><div class="formation-row" data-row-id="2"></div></div>
        <div class="row-wrapper"><div class="row-label">1st Row</div><div class="formation-row" data-row-id="1"></div></div>
    </div>

    <div id="member-roster">
        <h2>Select Members</h2>
        <div id="roster-list"></div>
    </div>

    <script>
        const allMembers = Array.from({ length: 51 }, (_, i) => ({
            id: `idol_${(i + 1).toString().padStart(2, '0')}`,
            name: `Member ${i + 1}`,
            image: `./images/100${(i + 1).toString().padStart(2, '0')}.jpg`
        }));

        // Initialize Roster
        const rosterList = document.getElementById('roster-list');
        allMembers.forEach(m => {
            const el = createMemberUI(m, 'roster');
            rosterList.appendChild(el);
        });

        // Setup Drop Zones
        document.querySelectorAll('.formation-row').forEach(row => {
            row.addEventListener('dragover', e => e.preventDefault());
            row.addEventListener('dragenter', e => e.target.classList.add('drag-over'));
            row.addEventListener('dragleave', e => e.target.classList.remove('drag-over'));
            row.addEventListener('drop', handleDrop);
        });

        function createMemberUI(data, type) {
            const div = document.createElement('div');
            div.classList.add('member-slot');
            div.id = type === 'roster' ? data.id : `canvas_${data.id}_${Math.random().toString(36).substr(2, 5)}`;
            div.setAttribute('draggable', 'true');
            
            const img = document.createElement('img');
            img.src = data.image;
            div.appendChild(img);

            div.addEventListener('dragstart', e => {
                e.dataTransfer.setData('memberId', data.id);
                e.dataTransfer.setData('sourceId', div.id);
                e.dataTransfer.setData('sourceType', type);
            });

            return div;
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            
            const memberId = e.dataTransfer.getData('memberId');
            const sourceId = e.dataTransfer.getData('sourceId');
            const sourceType = e.dataTransfer.getData('sourceType');
            
            if (sourceType === 'roster') {
                const rosterItem = document.getElementById(memberId);
                if (rosterItem.classList.contains('is-selected')) return;

                const data = allMembers.find(m => m.id === memberId);
                const formationItem = createMemberUI(data, 'canvas');
                
                // Clicking logic for the Formation Canvas
                formationItem.onclick = function() {
                    if (!this.classList.contains('is-center') && !this.classList.contains('is-newcomer')) {
                        this.classList.add('is-center');
                    } else if (this.classList.contains('is-center')) {
                        this.classList.remove('is-center');
                        this.classList.add('is-newcomer');
                    } else {
                        // PUT BACK TO ROSTER
                        rosterItem.classList.remove('is-selected');
                        this.remove();
                    }
                };

                rosterItem.classList.add('is-selected');
                this.appendChild(formationItem);
            } else {
                // Rearrange inside canvas
                const el = document.getElementById(sourceId);
                this.appendChild(el);
            }
        }

        function resetFormation() {
            document.querySelectorAll('.formation-row').forEach(r => r.innerHTML = '');
            document.querySelectorAll('.is-selected').forEach(m => m.classList.remove('is-selected'));
        }

        function downloadFormation() {
            html2canvas(document.getElementById('formation-canvas')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'senbatsu.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
